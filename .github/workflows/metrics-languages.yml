name: Metrics Languages

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  github-metrics-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: GabrielDS02

          base: header, metadata

          # Plugin de linguagens (idêntico ao teste que funcionou)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: no          # ← "no" igual ao teste bem-sucedido
          plugin_languages_analysis_timeout: 60

          # Nome do arquivo de saída (diferente para não sobrescrever o principal)
          filename: github-metrics-languages.svg

          # Tema escuro (opcional – remova se quiser manter o padrão transparente)
          config_theme: tokyonight

          # Commit automático
          committer_message: "⚙️ Atualiza gráfico de linguagens"
          committer_branch: main

          
