name: Metrics Languages

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # Atualiza a cada 12 horas (opcional)

jobs:
  github-metrics-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: GabrielDS02

          base: header, metadata   # Apenas cabeçalho, sem as outras seções

          config_theme: tokyonight   # Tema escuro igual aos outros gráficos

          # Plugin de linguagens
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 60
          # plugin_languages_categories: programming   # Descomente se quiser só linguagens de programação

          # Nome diferente para não sobrescrever o SVG principal
          filename: github-metrics-languages.svg

          # Commit automático
          committer_message: "⚙️ Atualiza gráfico de linguagens"
          committer_branch: main   # ou master, conforme sua branch padrão
