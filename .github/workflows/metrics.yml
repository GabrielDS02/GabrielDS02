name: Metrics

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: GabrielDS02

          base: header, activity, community, repositories, metadata

          # Tema escuro (tokyonight) igual aos outros gráficos do perfil
          config_theme: tokyonight

          # Linhas adicionadas/removidas
          plugin_lines: yes
          plugin_lines_sections: base

          # Commit automático do SVG
          committer_message: "⚙️ Atualiza métricas automáticas"
          committer_branch: main   # ou master, conforme sua branch padrão
